[project]
name = "utrack"
version = "0.1.0"
description = "Evidence-utility track: context-aided forecasting instrumentation (stages U0-U1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "openai>=3.16.0",
]

[project.scripts]
utrack = "utrack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utrack"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
